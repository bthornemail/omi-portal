<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMI Object Inbox</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#060b18; --panel:#0e1628; --panel2:#141e38; --line:#253152;
      --cyan:#5cf0ff; --green:#8bffb5; --purple:#c09dff; --amber:#ffdd88; --red:#ff6b7a; --orange:#ff9944;
      --ink:#eef2ff; --muted:#8a9ad8; --code:#080d1a; --shadow:0 1rem 2rem rgba(0,0,0,.5);
      --inspector-w:420px;
    }
    body{
      background:radial-gradient(ellipse at 10% 0%,rgba(92,240,255,.08),transparent 30rem),
                 radial-gradient(ellipse at 90% 20%,rgba(192,157,255,.06),transparent 26rem),
                 var(--bg);
      color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.5;
      min-height:100vh; display:flex; flex-direction:column;
    }
    pre,code{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace}
    .top-bar{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;border-bottom:1px solid var(--line);background:rgba(6,11,24,.8);backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
    .top-bar h1{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;color:var(--cyan);margin-right:auto}
    .top-bar .badge{font-size:.65rem}
    .layout{display:flex;flex:1;overflow:hidden}
    .main{flex:1;overflow-y:auto;padding:1rem 1.5rem 4rem;min-width:0}
    .inspector{width:var(--inspector-w);border-left:1px solid var(--line);overflow-y:auto;padding:1rem;background:var(--panel);display:none;flex-shrink:0}
    .inspector.open{display:block}
    .inspector h2{font-size:.9rem;font-weight:700;color:var(--cyan);border-left:3px solid var(--cyan);padding-left:.6rem;margin:.8rem 0 .4rem}
    .inspector h2:first-child{margin-top:0}
    .inspector .field{font-size:.76rem;padding:.25rem 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between}
    .inspector .field .val{font-family:monospace;color:var(--cyan);text-align:right;max-width:55%;word-break:break-all}
    .inspector pre{font-size:.68rem;margin-top:.3rem;max-height:200px;overflow:auto}
    .input-bar{display:flex;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap}
    .input-bar input[type=text]{flex:1;min-width:200px;background:var(--code);border:1px solid var(--line);border-radius:999px;padding:.6rem 1rem;color:var(--ink);font-family:monospace;font-size:.85rem}
    .input-bar input[type=text]:focus{border-color:var(--cyan);outline:none}
    .input-bar textarea{flex:1 1 100%;background:var(--code);border:1px solid var(--line);border-radius:16px;padding:.8rem;color:var(--ink);font-family:monospace;font-size:.82rem;min-height:80px;resize:vertical}
    .input-bar textarea:focus{border-color:var(--cyan);outline:none}
    button{
      background:linear-gradient(135deg,var(--cyan),var(--purple));border:0;border-radius:999px;
      padding:.5rem 1.2rem;font-weight:700;color:#080d1a;cursor:pointer;transition:all .2s;font-size:.8rem;white-space:nowrap;
    }
    button:hover{transform:translateY(-2px);filter:brightness(1.08)}
    button.sm{padding:.3rem .8rem;font-size:.72rem}
    button.sec{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line)}
    button.sec:hover{background:rgba(255,255,255,.08)}
    button.green{background:linear-gradient(135deg,var(--green),#4ca5ff)}
    button.amber{background:linear-gradient(135deg,var(--amber),var(--orange))}
    button.red{background:linear-gradient(135deg,var(--red),#cc5566)}
    .group-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:1.2rem 0 .5rem}
    .card-grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    .card{
      background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--panel);
      border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;backdrop-filter:blur(4px);
      transition:border-color .2s,box-shadow .2s;cursor:default;
    }
    .card:hover{border-color:rgba(92,240,255,.3)}
    .card.selected{border-color:var(--cyan);box-shadow:0 0 16px rgba(92,240,255,.12)}
    .card.accepted{border-color:var(--green);box-shadow:0 0 12px rgba(139,255,181,.08)}
    .card.rejected{border-color:var(--red);box-shadow:0 0 12px rgba(255,107,122,.08);opacity:.65}
    .card .title{font-size:.85rem;font-weight:600;margin-bottom:.15rem}
    .card .subtitle{font-size:.7rem;color:var(--muted);margin-bottom:.4rem}
    .card .actions{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.6rem}
    .card .tag{display:inline-block;background:rgba(92,240,255,.1);border-radius:999px;padding:.05rem .5rem;font-size:.62rem;font-weight:600;color:var(--cyan)}
    .tag.green{background:rgba(139,255,181,.12);color:var(--green)}
    .tag.purple{background:rgba(192,157,255,.12);color:var(--purple)}
    .tag.amber{background:rgba(255,221,136,.12);color:var(--amber)}
    .tag.red{background:rgba(255,107,122,.12);color:var(--red)}
    .empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
    .empty-state p{font-size:.9rem;margin-bottom:.5rem}
    .empty-state .big{font-size:2.5rem;margin-bottom:.5rem}
    .receipt-panel{margin-top:1rem;border-top:1px solid var(--line);padding-top:.8rem}
    .receipt-panel .entry{font-size:.76rem;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:.5rem;align-items:center}
    .receipt-panel .entry .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .canvas-view{display:none;margin-top:1rem;border:1px solid var(--line);border-radius:16px;background:var(--code);min-height:300px;position:relative;overflow:hidden}
    .canvas-view.open{display:block}
    .canvas-node{position:absolute;padding:6px 12px;border-radius:8px;font-size:.72rem;font-family:monospace;cursor:move;border:1px solid;min-width:60px;text-align:center}
    .canvas-edge{position:absolute;height:2px;transform-origin:0 0;z-index:0}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--panel);border:1px solid var(--green);border-radius:12px;padding:.6rem 1rem;font-size:.78rem;z-index:100;box-shadow:var(--shadow);display:none;animation:fadeIn .3s}
    .toast.show{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
    .badge{display:inline-block;background:rgba(92,240,255,.12);border:1px solid rgba(92,240,255,.2);border-radius:999px;padding:.1rem .6rem;font-size:.65rem;font-weight:600;color:var(--cyan)}
    .badge.green{background:rgba(139,255,181,.12);border-color:rgba(139,255,181,.2);color:var(--green)}
    .badge.amber{background:rgba(255,221,136,.12);border-color:rgba(255,221,136,.2);color:var(--amber)}
    .badge.red{background:rgba(255,107,122,.12);border-color:rgba(255,107,122,.2);color:var(--red)}
    .badge.purple{background:rgba(192,157,255,.12);border-color:rgba(192,157,255,.2);color:var(--purple)}
    .tab-bar{display:flex;gap:1px;margin-bottom:.8rem;background:var(--line);border-radius:10px;overflow:hidden;width:fit-content}
    .tab-bar button{background:var(--panel);border:0;padding:.4rem 1rem;font-size:.72rem;color:var(--muted);cursor:pointer;border-radius:0}
    .tab-bar button.active{background:var(--panel2);color:var(--cyan)}
  </style>
</head>
<body>
<div class="top-bar">
  <h1>OMI Object Inbox</h1>
  <span class="badge" id="objectCount">0 objects</span>
  <span class="badge" id="receiptCount">0 receipts</span>
  <button class="sec sm" onclick="toggleInspector()">Inspect</button>
  <button class="sm" onclick="exportAll()">Export</button>
</div>

<div class="layout">
  <div class="main" id="mainArea">
    <div class="input-bar">
      <textarea id="inputText" placeholder="Paste text, JSON, HTML, markdown, or an .omi address...">The chiral clock routes text into file blobs through graph links.</textarea>
    </div>
    <div class="input-bar">
      <button onclick="processInput()">Project</button>
      <button class="sec" onclick="document.getElementById('inputText').value=''">Clear</button>
    </div>

    <div class="tab-bar" id="viewTabs">
      <button class="active" onclick="switchView('cards')">Cards</button>
      <button onclick="switchView('canvas')">Canvas</button>
      <button onclick="switchView('receipts')">Receipts</button>
    </div>

    <div id="cardsView"></div>
    <div class="canvas-view" id="canvasView"></div>
    <div id="receiptsView" style="display:none"></div>
  </div>

  <div class="inspector" id="inspector">
    <h2>Inspector</h2>
    <div id="inspectorContent"><p style="font-size:.78rem;color:var(--muted)">Select an object to inspect.</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { compileTextToPOSSCGNN } from "../src/index.js";
import { packOWord, unpackOWord, oWordToHex, formatOWord } from "../src/omi/o-bitboard.js";
import { projectToOMI, projectToIMO } from "../src/omi/o-projector.js";
import { getU8, getU16, getU32, getU64, lanes } from "../src/omi/omi-imo-lanes.js";
import { packOFile, unpackOFile, oFileToBinary, oFileFromBinary } from "../src/omi/o-file-container.js";

let state = { objects: [], receipts: [], selectedId: null, container: [] };
let nextId = 1;

function groupObjects() {
  const g = { text: [], link: [], file: [], group: [], receipt: [] };
  for (const obj of state.objects) {
    const ch = obj.channel || '';
    if (ch === 'FS') g.file.push(obj);
    else if (ch === 'GS') g.link.push(obj);
    else if (ch === 'RS') g.group.push(obj);
    else if (ch === 'US') g.text.push(obj);
    else g.text.push(obj);
  }
  return g;
}

function projectionCarrier(obj) {
  const source = encodeURIComponent(obj.address || obj.id || obj.label || "object");
  const length = String(obj.label || obj.text || "").length;
  const hash = obj.hash || obj.id || "candidate";
  return `o---o/---/?v=${source};l=${length};h=${hash};b=beta1;s={4,3}@3C@`;
}

function projectionImo(obj) {
  const receipt = obj.accepted ? "accepted" : obj.rejected ? "rejected" : "candidate";
  return `o---o/---/?receipt=${receipt}@3C@`;
}

function render() {
  const groups = groupObjects();
  const cardsEl = document.getElementById('cardsView');
  const counts = { text: groups.text.length, link: groups.link.length, file: groups.file.length, group: groups.group.length, receipt: groups.receipt.length };

  document.getElementById('objectCount').textContent = `${state.objects.length} objects`;
  document.getElementById('receiptCount').textContent = `${state.receipts.length} receipts`;

  if (state.objects.length === 0) {
    cardsEl.innerHTML = `<div class="empty-state"><div class="big">&#128229;</div><p>Nothing projected yet.</p><p style="font-size:.78rem">Paste text above and click <strong>Project</strong> to create objects.</p></div>`;
    return;
  }

  let html = '';
  const labels = [
    ['text', 'Text', 'Objects', 'cyan', counts.text],
    ['link', 'Links', 'Routes', 'purple', counts.link],
    ['file', 'Files', 'Blobs', 'green', counts.file],
    ['group', 'Groups', 'Sets', 'amber', counts.group],
    ['receipt', 'Receipts', 'Accepted', 'green', counts.receipt],
  ];
  html += `<div class="row" style="gap:.4rem;margin-bottom:.6rem;font-size:.72rem;color:var(--muted)">`;
  for (const [key, label, _, color, count] of labels) {
    if (count > 0) html += `<span class="badge ${color}">${count} ${label}</span> `;
  }
  html += `</div>`;

  for (const [key, label, sub, color] of labels) {
    if (groups[key].length === 0) continue;
    html += `<div class="group-label">${label} (${sub})</div><div class="card-grid">`;
    for (const obj of groups[key]) {
      const sel = obj.id === state.selectedId ? 'selected' : '';
      const acc = obj.accepted ? 'accepted' : obj.rejected ? 'rejected' : '';
      const dataOmi = projectionCarrier(obj);
      const dataImo = projectionImo(obj);
      html += `<div id="o-inbox-${obj.id}" class="card ${sel} ${acc}" data-id="${obj.id}" data-omi="${escapeHtml(dataOmi)}" data-imo="${escapeHtml(dataImo)}" data-omi-channel="${escapeHtml(obj.channel || 'US')}" data-receipt-candidate="${!obj.accepted && !obj.rejected}" onclick="selectObject('${obj.id}')">
        <div class="title">${escapeHtml(obj.label || obj.text || 'object')}</div>
        <div class="subtitle">${obj.address || ''} <span class="tag ${color}">${obj.channel || 'US'}</span></div>
        <div class="subtitle">DOM exposes projection. Receipt accepts state.</div>
        <div class="actions">
          <button class="sec sm" onclick="event.stopPropagation();openObject('${obj.id}')">Open</button>
          <button class="sec sm" onclick="event.stopPropagation();editObject('${obj.id}')">Edit</button>
          <button class="sec sm" onclick="event.stopPropagation();routeObject('${obj.id}')">Route</button>
          ${!obj.accepted && !obj.rejected ? `<button class="green sm" onclick="event.stopPropagation();acceptObject('${obj.id}')">Accept</button>` : ''}
          ${!obj.rejected && !obj.accepted ? `<button class="red sm" onclick="event.stopPropagation();rejectObject('${obj.id}')">Reject</button>` : ''}
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  cardsEl.innerHTML = html;
  renderCanvas();
  renderReceipts();
}

function renderCanvas() {
  const canvas = document.getElementById('canvasView');
  if (state.objects.length === 0) { canvas.classList.remove('open'); return; }
  canvas.classList.add('open');
  const W = canvas.clientWidth || 600;
  const H = canvas.clientHeight || 300;
  const pad = 40;
  const cols = Math.ceil(Math.sqrt(state.objects.length * 1.5));
  const spacingX = (W - pad * 2) / Math.max(cols - 1, 1);
  const spacingY = (H - pad * 2) / Math.max(Math.ceil(state.objects.length / cols) - 1, 1);
  const chX = { US: 0, GS: W * 0.5, RS: W * 0.33, FS: W * 0.66 };

  let html = `<svg width="${W}" height="${H}" style="position:absolute;top:0;left:0;pointer-events:none">`;
  for (let i = 1; i < state.objects.length; i++) {
    const a = state.objects[i - 1], b = state.objects[i];
    const x1 = chX[a.channel] || pad + ((i - 1) % cols) * spacingX;
    const y1 = pad + Math.floor((i - 1) / cols) * spacingY;
    const x2 = chX[b.channel] || pad + (i % cols) * spacingX;
    const y2 = pad + Math.floor(i / cols) * spacingY;
    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#253152" stroke-width="1.5"/>`;
  }
  html += '</svg>';

  for (let i = 0; i < state.objects.length; i++) {
    const obj = state.objects[i];
    const x = chX[obj.channel] || pad + (i % cols) * spacingX;
    const y = pad + Math.floor(i / cols) * spacingY;
    const colors = { US: 'var(--cyan)', GS: 'var(--purple)', RS: 'var(--amber)', FS: 'var(--green)' };
    html += `<div id="o-canvas-${obj.id}" class="canvas-node" style="left:${x}px;top:${y}px;border-color:${colors[obj.channel] || '#555'};background:rgba(0,0,0,.7)" data-id="${obj.id}" data-omi="${escapeHtml(projectionCarrier(obj))}" data-imo="${escapeHtml(projectionImo(obj))}" data-omi-channel="${escapeHtml(obj.channel || 'US')}" data-receipt-candidate="${!obj.accepted && !obj.rejected}">
      ${escapeHtml((obj.label || obj.text || '?').slice(0, 20))}
    </div>`;
  }
  canvas.innerHTML = html;
  const nodes = canvas.querySelectorAll('.canvas-node');
  nodes.forEach(n => {
    n.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const ox = e.clientX - n.offsetLeft - rect.left;
      const oy = e.clientY - n.offsetTop - rect.top;
      const onMove = ev => { n.style.left = (ev.clientX - rect.left - ox) + 'px'; n.style.top = (ev.clientY - rect.top - oy) + 'px'; };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    n.addEventListener('click', () => selectObject(n.dataset.id));
  });
}

function renderReceipts() {
  const el = document.getElementById('receiptsView');
  if (state.receipts.length === 0) {
    el.innerHTML = `<div class="empty-state"><p style="font-size:.82rem">No receipts yet. Accept an object to create one.</p></div>`;
    return;
  }
  let html = `<div class="receipt-panel"><div class="group-label">Receipt History</div>`;
  for (const r of state.receipts.slice().reverse()) {
    const dot = r.action === 'accept' ? 'var(--green)' : 'var(--red)';
    html += `<div class="entry"><span class="status-dot" style="background:${dot}"></span>
      <span style="flex:1">${r.action === 'accept' ? 'Accepted' : 'Rejected'} <strong>${escapeHtml(r.label)}</strong></span>
      <span style="font-family:monospace;font-size:.68rem;color:var(--muted)">${r.hash.slice(0,12)}</span>
      <span style="font-size:.65rem;color:var(--muted)">${new Date(r.time).toLocaleTimeString()}</span>
    </div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

function showToast(msg, color = 'var(--green)') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.borderColor = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Exposed globals
window.selectObject = function(id) {
  state.selectedId = id;
  render();
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  const insp = document.getElementById('inspectorContent');
  const json = JSON.stringify(obj._raw || obj, null, 2);
  const da = obj.dataAttributes || {};
  const parts = obj.parts || {};
  const hasOWord = obj.oWord != null;
  const dataOmi = projectionCarrier(obj);
  const dataImo = projectionImo(obj);
  let oSection = '';
  if (hasOWord) {
    const fmt = formatOWord(obj.oWord);
    const omi = projectToOMI(obj.oWord);
    const imo = projectToIMO(obj.oWord);
    oSection = `
      <div class="o-section">
        <h2>Compiled Carrier (.o)</h2>
        <div class="field"><span>Selector</span><span class="val">${fmt.selector}</span></div>
        <div class="field"><span>Path (19-bit)</span><span class="val">0x${fmt.path.toString(16).padStart(5, '0')}</span></div>
        <div class="field"><span>Surface (236-bit)</span><span class="val" style="font-size:.58rem">0x${fmt.surface.toString(16).padStart(59, '0')}</span></div>
        <div class="field"><span>O-Word Hex</span><span class="val" style="font-size:.58rem;max-width:70%">${fmt.hex}</span></div>
        <div style="margin-top:.4rem;border-top:1px solid var(--line);padding-top:.4rem">
          <div style="font-size:.72rem;color:var(--green);margin-bottom:.2rem">→ .omi</div>
          <pre style="font-size:.65rem;max-height:80px">${escapeHtml(omi)}</pre>
          <div style="font-size:.72rem;color:var(--amber);margin:.2rem 0">→ .imo</div>
          <pre style="font-size:.65rem;max-height:80px">${escapeHtml(imo)}</pre>
        </div>
        <div style="margin-top:.4rem;border-top:1px solid var(--line);padding-top:.4rem">
          <h2>Lane Views</h2>
          <div style="font-size:.7rem;display:grid;grid-template-columns:1fr 1fr;gap:.15rem .6rem">
            <div style="color:var(--muted)">u64[0..3]</div>
            <div style="font-family:monospace;color:var(--amber);text-align:right;word-break:break-all">${[0,1,2,3].map(i => `0x${BigInt(getU64(obj.oWord, i)).toString(16).padStart(16,'0')}`).join(' ')}</div>
            <div style="color:var(--muted)">u32[0..7]</div>
            <div style="font-family:monospace;color:var(--cyan);text-align:right;word-break:break-all">${lanes(obj.oWord, 32).map(v => `0x${v.toString(16).padStart(8,'0')}`).join(' ')}</div>
            <div style="color:var(--muted)">u16[0..15]</div>
            <div style="font-family:monospace;color:var(--green);text-align:right;word-break:break-all;font-size:.62rem">${lanes(obj.oWord, 16).map(v => `0x${v.toString(16).padStart(4,'0')}`).join(' ')}</div>
            <div style="color:var(--muted)">u8[0..31]</div>
            <div style="font-family:monospace;color:var(--purple);text-align:right;word-break:break-all;font-size:.58rem">${lanes(obj.oWord, 8).map(v => v.toString(16).padStart(2,'0')).join(' ')}</div>
          </div>
        </div>
        <div style="margin-top:.3rem">
          <button class="sm sec" onclick="event.stopPropagation();recompileOWord('${obj.id}')">Recompile</button>
          <button class="sm sec" onclick="event.stopPropagation();clearOWord('${obj.id}')">Clear</button>
        </div>
      </div>`;
  }
  insp.innerHTML = `
    <div class="field"><span>Address</span><span class="val">${obj.address || '—'}</span></div>
    <div class="field"><span>Channel</span><span class="val">${obj.channel || '—'}</span></div>
    <div class="field"><span>POS</span><span class="val">${obj.pos || '—'}</span></div>
    <div class="field"><span>Status</span><span class="val">${obj.accepted ? 'Accepted' : obj.rejected ? 'Rejected' : 'Pending'}</span></div>
    <omi><imo><o id="projection-inbox-${obj.id}" data-omi="${escapeHtml(dataOmi)}" data-imo="${escapeHtml(dataImo)}">DOM exposes projection. Receipt accepts state.</o></imo></omi>
    <div class="field"><span>data-omi</span><span class="val" style="font-size:.62rem">${escapeHtml(dataOmi)}</span></div>
    <div class="field"><span>data-imo</span><span class="val" style="font-size:.62rem">${escapeHtml(dataImo)}</span></div>
    <div class="field"><span>Handles</span><span class="val">id data-omi data-imo &lt;o&gt; &lt;omi&gt; &lt;imo&gt;</span></div>
    <div class="field"><span>Boundary</span><span class="val">DOM exposes projection. Receipt accepts state.</span></div>
    ${obj.posHex ? `<div class="field"><span>POS Hex</span><span class="val">${obj.posHex}</span></div>` : ''}
    ${obj.selector ? `<div class="field"><span>Selector</span><span class="val">${obj.selector}</span></div>` : ''}
    ${Object.keys(da).length ? `<h2>data-omi Attributes</h2>${Object.entries(da).map(([k,v]) => `<div class="field"><span>${escapeHtml(k)}</span><span class="val" style="font-size:.68rem">${escapeHtml(v)}</span></div>`).join('')}` : ''}
    ${Object.keys(parts).length ? `<h2>Parsed Parts</h2>${Object.entries(parts).map(([k,v]) => `<div class="field"><span>${escapeHtml(k)}</span><span class="val" style="font-size:.68rem">${escapeHtml(String(v))}</span></div>`).join('')}` : ''}
    ${oSection}
    <div style="margin-top:.5rem;border-top:1px solid var(--line);padding-top:.5rem">
      <button class="sm" onclick="event.stopPropagation();compileToOWord('${obj.id}')">Compile to .o</button>
      <button class="sm sec" onclick="event.stopPropagation();addToContainer('${obj.id}')">Add to Container</button>
    </div>
    ${state.container.length > 0 ? `
    <div class="o-section" style="margin-top:.5rem;border-top:1px solid var(--line);padding-top:.5rem">
      <h2>Container (${state.container.length} words)</h2>
      <div class="field"><span>Word Count</span><span class="val">${state.container.length}</span></div>
      <div class="field"><span>Total Bits</span><span class="val">${state.container.length * 256}</span></div>
      <div style="margin-top:.3rem;display:flex;gap:.3rem;flex-wrap:wrap">
        <button class="sm sec" onclick="event.stopPropagation();exportContainerHex()">Export .o Hex</button>
        <button class="sm sec" onclick="event.stopPropagation();exportContainerBinary()">Export .o Binary</button>
        <button class="sm sec" onclick="event.stopPropagation();clearContainer()">Clear</button>
      </div>
    </div>
    ` : ''}
    <h2>Raw JSON</h2>
    <pre>${escapeHtml(json)}</pre>
  `;
  document.getElementById('inspector').classList.add('open');
};

window.openObject = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  showToast(`Opened: ${obj.label || obj.text || 'object'}`);
};

window.editObject = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  const newLabel = prompt('Edit label:', obj.label || obj.text || '');
  if (newLabel !== null) {
    obj.label = newLabel;
    render();
    showToast(`Updated: ${newLabel}`);
  }
};

window.routeObject = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  const ch = prompt('Route to channel (US, GS, RS, FS):', obj.channel || 'US');
  if (ch && ['US','GS','RS','FS'].includes(ch.toUpperCase())) {
    obj.channel = ch.toUpperCase();
    render();
    showToast(`Routed to ${ch.toUpperCase()}`);
  }
};

window.acceptObject = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  obj.accepted = true;
  obj.rejected = false;
  const hash = '0x' + [...(obj.label || obj.text || id)].reduce((h, c) => ((h << 5n) - h + BigInt(c.charCodeAt(0))) & 0xFFFFFFFFn, 0n).toString(16).padStart(8, '0');
  state.receipts.push({ id: nextId++, label: obj.label || obj.text || 'object', action: 'accept', hash, time: Date.now() });
  render();
  showToast(`Accepted: ${obj.label || obj.text || 'object'} — ${hash.slice(0,12)}`);
};

window.rejectObject = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  obj.rejected = true;
  obj.accepted = false;
  const hash = '0x' + [...(obj.label || obj.text || id)].reduce((h, c) => ((h << 5n) - h + BigInt(c.charCodeAt(0))) & 0xFFFFFFFFn, 0n).toString(16).padStart(8, '0');
  state.receipts.push({ id: nextId++, label: obj.label || obj.text || 'object', action: 'reject', hash, time: Date.now() });
  render();
  showToast(`Rejected: ${obj.label || obj.text || 'object'}`);
};

window.exportAll = function() {
  const data = JSON.stringify({ objects: state.objects, receipts: state.receipts }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `omi-inbox-${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Exported inbox state');
};

window.toggleInspector = function() {
  document.getElementById('inspector').classList.toggle('open');
};

window.switchView = function(view) {
  document.querySelectorAll('#viewTabs button').forEach(b => b.classList.remove('active'));
  document.querySelector(`#viewTabs button[onclick*="${view}"]`)?.classList.add('active');
  document.getElementById('cardsView').style.display = view === 'cards' ? '' : 'none';
  document.getElementById('canvasView').style.display = view === 'canvas' ? '' : 'none';
  document.getElementById('canvasView').classList.toggle('open', view === 'canvas');
  document.getElementById('receiptsView').style.display = view === 'receipts' ? '' : 'none';
  if (view === 'canvas') setTimeout(() => renderCanvas(), 50);
};

window.compileToOWord = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  try {
    const selector = obj.rejected ? 1 : obj.accepted ? 0 : 0;
    const path = obj.parts?.us ? parseInt(obj.parts.us.replace('0x',''), 16) : (obj.posHex ? parseInt(obj.posHex, 16) : 0);
    const seed = (obj.address || obj.label || obj.text || id).split('').reduce((h, c) => ((h << 5n) - h + BigInt(c.charCodeAt(0))) & 0xFFFFFFFFFFFFFFFFn, 0n);
    const surface = seed & ((1n << 236n) - 1n);
    const word = packOWord({ selector, path, surface });
    obj.oWord = word;
    render();
    selectObject(id);
    showToast(`Compiled .o carrier: ${oWordToHex(word).slice(0, 20)}...`);
  } catch (e) {
    showToast(`Compile error: ${e.message}`, 'var(--red)');
  }
};

window.recompileOWord = function(id) { compileToOWord(id); };
window.clearOWord = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (obj) { obj.oWord = undefined; render(); selectObject(id); }
  showToast('Cleared .o carrier');
};

window.addToContainer = function(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj || obj.oWord == null) { showToast('Compile to .o first', 'var(--red)'); return; }
  state.container.push(obj.oWord);
  render();
  selectObject(id);
  showToast(`Added word ${state.container.length} to container`);
};

window.exportContainerHex = function() {
  if (state.container.length === 0) { showToast('Container is empty', 'var(--red)'); return; }
  const text = packOFile(state.container);
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `omi-container-${Date.now()}.o`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`Exported ${state.container.length}-word .o container`);
};

window.exportContainerBinary = function() {
  if (state.container.length === 0) { showToast('Container is empty', 'var(--red)'); return; }
  const buf = oFileToBinary(state.container);
  const blob = new Blob([buf], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `omi-container-${Date.now()}.ob`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`Exported ${state.container.length}-word binary .o container`);
};

window.clearContainer = function() {
  state.container = [];
  render();
  showToast('Cleared container');
};

window.processInput = async function() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) { showToast('Enter some text first', 'var(--red)'); return; }
  try {
    const result = compileTextToPOSSCGNN(text);
    const objects = [];
    const tokens = result.tokens || [];
    const canvas = result.canvas || {};
    const tokenNodes = (canvas.nodes || []).filter(n =>
      String(n.id || '').startsWith('tok-')
    );
    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i];
      const node = tokenNodes[i] || {};
      const omi = node.omi || {};
      objects.push({
        id: `obj-${nextId++}`,
        label: node.label || `${t.pos || omi.pos || 'TOK'}:${t.value || t.normal || `token-${i}`}`,
        text: t.value || t.normal || node.text || '',
        normal: t.normal || '',
        pos: t.pos || omi.pos || '',
        posHex: omi.posHex || '',
        channel: omi.portChannel || node.channel || 'US',
        address: omi.address || node.address || '',
        selector: omi.selector || '',
        dataAttributes: omi.dataAttributes || {},
        parts: omi.parts || {},
        aliases: omi.aliases || {},
        accepted: false, rejected: false,
        _raw: { token: t, canvasNode: node },
      });
    }
    if (objects.length === 0) {
      objects.push({
        id: `obj-${nextId++}`, label: text.slice(0, 40), text,
        channel: 'US', accepted: false, rejected: false, _raw: { text },
      });
    }
    state.objects = objects;
    state.selectedId = null;
    render();
    showToast(`Projected ${objects.length} objects`);
  } catch (e) {
    showToast(`Error: ${e.message}`, 'var(--red)');
  }
};

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
</script>
</body>
</html>
