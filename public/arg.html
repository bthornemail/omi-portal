<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMI ARG World — A-Frame Projection</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060b18;overflow:hidden;font-family:system-ui,sans-serif}
    #info{
      position:fixed;top:1rem;left:1rem;z-index:100;
      background:rgba(6,11,24,.85);backdrop-filter:blur(8px);
      border:1px solid #253152;border-radius:12px;
      padding:.6rem 1rem;color:#eef2ff;font-size:.78rem;
      max-width:300px;pointer-events:none;
    }
    #info .title{color:#5cf0ff;font-weight:700;font-size:.85rem}
    #info .count{color:#8a9ad8;font-size:.7rem}
    #legend{
      position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
      z-index:100;display:flex;gap:1rem;
      background:rgba(6,11,24,.8);backdrop-filter:blur(8px);
      border:1px solid #253152;border-radius:999px;
      padding:.4rem 1.2rem;font-size:.7rem;color:#8a9ad8;
    }
    #legend span{display:flex;align-items:center;gap:.3rem}
    #legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    #hud{
      position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);
      z-index:100;display:none;gap:.6rem;align-items:center;
      background:rgba(6,11,24,.9);backdrop-filter:blur(8px);
      border:1px solid #5cf0ff;border-radius:16px;
      padding:.6rem 1.2rem;font-size:.78rem;color:#eef2ff;
    }
    #hud.open{display:flex}
    #hud .label{color:#8a9ad8;font-size:.7rem}
    #hud button{
      background:transparent;border:1px solid;border-radius:999px;
      padding:.3rem 1rem;font-size:.72rem;font-weight:600;cursor:pointer;
      color:#eef2ff;transition:all .2s;
    }
    #hud button:hover{transform:translateY(-2px);filter:brightness(1.1)}
    #hud .accept{border-color:#8bffb5;color:#8bffb5}
    #hud .accept:hover{background:rgba(139,255,181,.15)}
    #hud .reject{border-color:#ff6b7a;color:#ff6b7a}
    #hud .reject:hover{background:rgba(255,107,122,.15)}
    #receipt-toast{
      position:fixed;top:4.5rem;right:1.5rem;z-index:100;
      background:rgba(6,11,24,.9);backdrop-filter:blur(8px);
      border:1px solid;border-radius:12px;
      padding:.5rem 1rem;font-size:.7rem;color:#eef2ff;
      display:none;max-width:280px;font-family:monospace;
    }
    #receipt-toast.show{display:block}
  </style>
</head>
<body>
  <div id="info">
    <div class="title">&#127760; OMI ARG World</div>
    <div class="count" id="entityCount">Loading...</div>
  </div>

  <div id="legend">
    <span><span class="dot" style="background:#5cf0ff"></span> Motif</span>
    <span><span class="dot" style="background:#8bffb5"></span> Receipted</span>
    <span><span class="dot" style="background:#ff6b7a"></span> Rejected</span>
    <span><span class="dot" style="background:#888"></span> Unresolved</span>
  </div>

  <div id="hud" class="">
    <span id="hudLabel" class="label">—</span>
    <span id="hudMotif" style="font-weight:600">—</span>
    <button class="accept" id="btnAccept" onclick="window.__acceptEntity()">Accept</button>
    <button class="reject" id="btnReject" onclick="window.__rejectEntity()">Reject</button>
  </div>

  <div id="receipt-toast"></div>

  <a-scene background="color:#060b18" fog="type:linear;color:#060b18;near:12;far:28">
    <a-entity id="camera" camera="fov:70" position="0 4 14"
      look-controls wasd-controls
      cursor="rayOrigin:mouse"
      raycaster="objects:[data-omi];interval:100;far:30">
    </a-entity>

    <a-entity id="world-container" position="0 0 0">
      <a-entity id="torus-ring"
        geometry="primitive:torus;radius:9.6;tube:2.4;segmentsTubular:48;segmentsRadial:12"
        material="color:#1a2748;metalness:0.2;roughness:0.8;transparent:true;opacity:0.3"
        position="0 0 0">
      </a-entity>

      <a-entity id="entities"></a-entity>

      <a-entity light="type:ambient;color:#446688;intensity:0.4"></a-entity>
      <a-entity light="type:directional;color:#8bffb5;intensity:0.6" position="5 10 5"></a-entity>
    </a-entity>

    <a-sky color="#060b18"></a-sky>
  </a-scene>

  <script type="module">
    import { compileTextToPOSSCGNN } from "../src/index.js";
    import { compileWorldTopology, resolveMotifToEmoji, resolveMotifToSynset } from "../src/arg/world-topology-compiler.js";
    import { createGenomeNode, compileGenomeNode, createEdge } from "../src/arg/world-genome.js";
    import { compileTopologyToScene } from "../src/arg/aframe-world-entity.js";
    import { handleEntityClick, getEntityRouteOptions, isEntityActivated } from "../src/arg/arg-interaction.js";
    import { createAcceptReceipt, createRejectReceipt, importReceipt, formatReceipt } from "../src/arg/arg-receipts.js";
    import { activateRoute, getCandidateReading } from "../src/arg/arg-route-activation.js";

    const DEFAULT_TEXT = `The Gate opens for the Logos, who measures by Number.
    The Beast requires Wisdom. Wisdom unlocks the Gate.`;

    let topo = null;
    let activations = [];
    let selectedEntityId = null;

    function showReceipt(msg, hash, color) {
      const el = document.getElementById("receipt-toast");
      el.style.borderColor = color;
      el.innerHTML = `<div style="font-size:.82rem;font-weight:600">${msg}</div>
        <div style="color:#8a9ad8;font-size:.65rem;word-break:break-all">${hash.slice(0, 24)}</div>`;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 4000);
    }

    window.__selectEntity = function(entityId) {
      selectedEntityId = entityId;
      const node = topo ? topo.getNode(entityId) : null;
      if (!node) return;

      const hud = document.getElementById("hud");
      document.getElementById("hudLabel").textContent = node.emoji || "";
      document.getElementById("hudMotif").textContent = node.motif || entityId;
      hud.classList.add("open");

      const activation = handleEntityClick(entityId, topo);
      if (activation) activations.push(activation);
    };

    window.__acceptEntity = function() {
      if (!selectedEntityId || !topo) return;
      const node = topo.getNode(selectedEntityId);
      if (!node) return;

      const receipt = createAcceptReceipt(node, topo);
      if (!receipt) return;

      const formatted = formatReceipt(receipt);
      showReceipt("Accepted", formatted.receiptHash, "#8bffb5");
      updateScene();
    };

    window.__rejectEntity = function() {
      if (!selectedEntityId || !topo) return;
      const node = topo.getNode(selectedEntityId);
      if (!node) return;

      const receipt = createRejectReceipt(node, topo);
      if (!receipt) return;

      const formatted = formatReceipt(receipt);
      showReceipt("Rejected", formatted.receiptHash, "#ff6b7a");
      updateScene();
    };

    function updateScene() {
      if (!topo) return;
      const scene = compileTopologyToScene(topo);
      document.getElementById("entities").innerHTML = scene.html;

      document.getElementById("entityCount").textContent =
        `${scene.entityCount} entities (${scene.receiptCount} receipted)`;

      const aframeEntities = document.querySelectorAll("[data-omi]");
      for (const el of aframeEntities) {
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-omi");
          window.__selectEntity(id);
        });
        el.addEventListener("mouseenter", () => {
          el.setAttribute("material", "color", "#ffdd88");
        });
        el.addEventListener("mouseleave", () => {
          const node = topo.getNode(el.getAttribute("data-omi"));
          if (node && node.receipt) {
            const color = node.receipt.action === "reject" ? "#ff6b7a" : "#8bffb5";
            el.setAttribute("material", "color", color);
          } else {
            el.setAttribute("material", "color", "#5cf0ff");
          }
        });
      }
    }

    async function init() {
      const text = new URLSearchParams(location.search).get("text") || DEFAULT_TEXT;
      document.getElementById("entityCount").textContent = `Projecting...`;

      const motifs = [
        { id: "gate", motif: "Gate", keywords: ["gate", "opens"] },
        { id: "logos", motif: "Logos", keywords: ["logos", "word", "meaning"] },
        { id: "number", motif: "Number", keywords: ["number", "measure", "count"] },
        { id: "beast", motif: "Beast", keywords: ["beast"] },
        { id: "wisdom", motif: "Wisdom", keywords: ["wisdom", "wise"] }
      ];

      const lower = text.toLowerCase();
      const detected = motifs.filter(m => m.keywords.some(kw => lower.includes(kw)));

      const nodes = detected.map(m => {
        const n = createGenomeNode(m.id, m.motif, resolveMotifToEmoji(m.motif), resolveMotifToSynset(m.motif));
        compileGenomeNode(n);
        return n;
      });

      const edges = [];
      for (let i = 1; i < nodes.length; i++)
        edges.push(createEdge(nodes[i - 1].id, nodes[i].id, "hyp"));
      if (nodes.length >= 3)
        edges.push(createEdge(nodes[nodes.length - 1].id, nodes[0].id, "mirrors"));

      topo = compileWorldTopology(nodes, edges);
      updateScene();
    }

    init().catch(err => {
      document.getElementById("entityCount").textContent = `Error: ${err.message}`;
    });
  </script>
</body>
</html>
