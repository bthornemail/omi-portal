<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMI Narrative Movie — WordNet Pipeline</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060b18;overflow:hidden;font-family:system-ui,sans-serif}
    #loading{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060b18;color:#eef2ff;font-size:1rem;gap:1rem;transition:opacity .6s}
    #loading.hidden{opacity:0;pointer-events:none}
    #loading .spinner{width:32px;height:32px;border:3px solid #253152;border-top-color:#5cf0ff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loading .status{font-size:.78rem;color:#8a9ad8}
    #loading .error{color:#ff6b7a;font-size:.7rem;max-width:400px;text-align:center}
    #hud{position:fixed;top:1rem;left:1rem;right:1rem;z-index:100;background:rgba(6,11,18,.88);backdrop-filter:blur(8px);border:1px solid #253152;border-radius:12px;padding:.6rem 1rem;color:#eef2ff;font-size:.78rem;max-width:480px;pointer-events:none}
    #hud .phase{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:#8a9ad8}
    #hud .title{color:#5cf0ff;font-weight:700;font-size:.85rem;margin:.1rem 0}
    #hud .caption{font-size:.7rem;color:#c8d0ff;line-height:1.4;max-height:2.8rem;overflow:hidden}
    #hud .meta-row{display:flex;align-items:center;gap:.5rem;margin-top:.3rem}
    #hud .progress-bar{flex:1;height:3px;background:#253152;border-radius:2px;overflow:hidden}
    #hud .progress-fill{height:100%;background:#5cf0ff;border-radius:2px;transition:width .3s}
    #hud .beat-info{font-size:.6rem;color:#8a9ad8;font-family:monospace}
    #hud .wordnet-badge{font-size:.55rem;color:#8a9ad8;font-family:monospace;display:inline-block;margin-top:.2rem}
    #controls{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:.4rem;align-items:center;background:rgba(6,11,18,.85);backdrop-filter:blur(8px);border:1px solid #253152;border-radius:999px;padding:.4rem .8rem}
    #controls button{background:transparent;border:1px solid #253152;border-radius:999px;padding:.3rem .7rem;font-size:.7rem;font-weight:600;cursor:pointer;color:#eef2ff;transition:all .2s;white-space:nowrap}
    #controls button:hover{border-color:#5cf0ff;background:rgba(92,240,255,.1)}
    #controls button.primary{border-color:#5cf0ff;color:#5cf0ff}
    #controls button.play{background:#5cf0ff;color:#060b18;border-color:#5cf0ff}
    #controls .sep{width:1px;height:20px;background:#253152}
    #controls .info{font-size:.65rem;color:#8a9ad8;font-family:monospace;padding:0 .3rem}
    #interaction-panel{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);z-index:100;display:none;gap:.6rem;align-items:center;background:rgba(6,11,18,.9);backdrop-filter:blur(8px);border:1px solid #5cf0ff;border-radius:16px;padding:.5rem 1rem;font-size:.78rem;color:#eef2ff}
    #interaction-panel.open{display:flex}
    #interaction-panel .label{color:#8a9ad8;font-size:.7rem}
    #interaction-panel .motif-label{font-weight:600}
    #interaction-panel .route-opts{display:flex;gap:.3rem;margin:0 .3rem}
    #interaction-panel .route-opts button{background:transparent;border:1px solid #8a9ad8;border-radius:999px;padding:.15rem .5rem;font-size:.6rem;cursor:pointer;color:#8a9ad8}
    #interaction-panel .route-opts button:hover{border-color:#5cf0ff;color:#5cf0ff}
    #interaction-panel .accept{border-color:#8bffb5;color:#8bffb5;cursor:pointer}
    #interaction-panel .reject{border-color:#ff6b7a;color:#ff6b7a;cursor:pointer}
    #interaction-panel .close-btn{border-color:#666;color:#666;cursor:pointer}
    #toast{position:fixed;top:4.5rem;right:1.5rem;z-index:100;background:rgba(6,11,18,.9);backdrop-filter:blur(8px);border:1px solid;border-radius:12px;padding:.4rem .8rem;font-size:.68rem;color:#eef2ff;display:none;max-width:260px;font-family:monospace}
    #toast.show{display:block}

    #livePanelBtn.active{border-color:#5cf0ff;background:rgba(92,240,255,.15)}
    #livePanel{position:fixed;top:0;right:-380px;width:340px;height:100%;z-index:200;background:rgba(6,11,18,.94);backdrop-filter:blur(10px);border-left:1px solid #253152;display:flex;flex-direction:column;transition:right .35s cubic-bezier(.4,0,.2,1);color:#eef2ff;font-size:.72rem;overflow:hidden}
    #livePanel.open{right:0}
    #livePanel .panel-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;border-bottom:1px solid #253152;font-size:.78rem;font-weight:600}
    #livePanel .panel-header .close{background:none;border:1px solid #666;border-radius:999px;padding:.1rem .4rem;cursor:pointer;color:#8a9ad8;font-size:.6rem}
    #livePanel .section{padding:.5rem .8rem;border-bottom:1px solid #1a2748}
    #livePanel .section-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:#8a9ad8;margin-bottom:.3rem}
    #livePanel .stat-row{display:flex;gap:.8rem;flex-wrap:wrap}
    #livePanel .stat{display:flex;align-items:center;gap:.3rem}
    #livePanel .stat .value{font-family:monospace;color:#5cf0ff;font-size:.78rem}
    #livePanel .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    #livePanel .dot.on{background:#8bffb5;box-shadow:0 0 6px #8bffb5}
    #livePanel .dot.off{background:#666}
    #livePanel .dot.err{background:#ff6b7a;box-shadow:0 0 6px #ff6b7a}
    #livePanel .event-log{flex:1;overflow-y:auto;padding:.3rem .8rem;font-family:monospace;font-size:.62rem;line-height:1.6;min-height:0}
    #livePanel .event-log::-webkit-scrollbar{width:3px}
    #livePanel .event-log::-webkit-scrollbar-track{background:#1a2748}
    #livePanel .event-log::-webkit-scrollbar-thumb{background:#253152;border-radius:2px}
    #livePanel .event-entry{display:flex;gap:.4rem;align-items:baseline;opacity:.85}
    #livePanel .event-entry .op-tag{display:inline-block;width:1.2rem;height:1.2rem;border-radius:3px;text-align:center;line-height:1.2rem;font-size:.55rem;font-weight:700;color:#060b18;flex-shrink:0}
    #livePanel .event-entry .addr{color:#c8d0ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #livePanel .event-entry .time{color:#555;flex-shrink:0;font-size:.55rem}
    #livePanel .nat64-row{display:flex;gap:.4rem;align-items:center}
    #livePanel .nat64-row input{flex:1;background:transparent;border:1px solid #253152;border-radius:6px;padding:.25rem .5rem;color:#eef2ff;font-size:.68rem;font-family:monospace;outline:none}
    #livePanel .nat64-row input:focus{border-color:#5cf0ff}
    #livePanel .nat64-row button{background:transparent;border:1px solid #5cf0ff;border-radius:999px;padding:.2rem .6rem;font-size:.6rem;cursor:pointer;color:#5cf0ff}
    #livePanel .nat64-row button:hover{background:rgba(92,240,255,.1)}
    #livePanel .nat64-row button:disabled{opacity:.3;cursor:not-allowed}
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingStatus" class="status">Initializing...</div>
    <div id="loadingError" class="error" style="display:none"></div>
  </div>

  <div id="hud">
    <div class="phase" id="phaseLabel">PRELUDE</div>
    <div class="title" id="titleLabel">—</div>
    <div class="caption" id="captionLabel">—</div>
    <div class="meta-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="beat-info" id="beatInfo">0 / 0</div>
    </div>
    <div class="wordnet-badge" id="wordnetBadge">wordnet: loading...</div>
    <omi><imo><o id="arg-projection-boundary" data-omi="o---o/---/?v=arg;l=3;h=movie;b=beta1;s={4,3}@3C@" data-imo="o---o/---/?receipt=candidate@3C@">DOM exposes projection. Receipt accepts state.</o></imo></omi>
  </div>

  <div id="controls">
    <button onclick="window.__prev()">◀ Prev</button>
    <button class="play" id="playBtn" onclick="window.__play()">▶ Play</button>
    <button onclick="window.__next()">Next ▶</button>
    <span class="sep"></span>
    <span class="sep"></span>
    <button id="livePanelBtn" onclick="window.__toggleLivePanel()" title="Live Portal">🌐</button>
    <span class="info" id="receiptCount">0 rec</span>
    <span class="info" id="epochInfo">t0 e0</span>
  </div>

  <div id="interaction-panel">
    <span class="label">Entity:</span>
    <span class="motif-label" id="entityLabel">—</span>
    <span class="route-opts" id="routeOptions"></span>
    <button class="accept" onclick="window.__acceptEntity()">Accept</button>
    <button class="reject" onclick="window.__rejectEntity()">Reject</button>
    <button class="close-btn" onclick="window.__closeInteraction()">✕</button>
  </div>

  <div id="toast"></div>

  <div id="livePanel">
    <div class="panel-header">
      <span>🌐 Live Portal</span>
      <button class="close" onclick="window.__toggleLivePanel()">✕</button>
    </div>
    <div class="section">
      <div class="section-label">Connection</div>
      <div class="stat-row">
        <span class="stat"><span class="dot off" id="connDot"></span><span id="connStatus">disconnected</span></span>
        <span class="stat">events <span class="value" id="liveEventCount">0</span></span>
        <span class="stat">voxels <span class="value" id="liveVoxelCount">0</span></span>
      </div>
    </div>
    <div class="event-log" id="liveEventLog">
      <div style="color:#555;padding:.5rem;text-align:center">No events yet</div>
    </div>
    <div class="section">
      <div class="section-label">NAT64 Inject</div>
      <div class="nat64-row">
        <input type="text" id="nat64Input" placeholder="e.g. 192.168.1.42" value="10.0.0.1">
        <button id="nat64InjectBtn" onclick="window.__injectNat64()">Inject</button>
      </div>
    </div>
  </div>

  <a-scene background="color:#060b18" fog="type:linear;color:#060b18;near:12;far:28">
    <a-entity id="camera" camera="fov:70" position="0 4 14"
      look-controls wasd-controls
      cursor="rayOrigin:mouse"
      raycaster="objects:[data-omi];interval:100;far:30">
    </a-entity>
    <a-entity id="world-container" position="0 0 0">
      <a-entity id="entities"
        geometry="primitive:torus;radius:9.6;tube:2.4;segmentsTubular:48;segmentsRadial:12"
        material="color:#1a2748;metalness:0.2;roughness:0.8;transparent:true;opacity:0.3">
        <a-entity id="entityList"></a-entity>
      </a-entity>
      <a-entity light="type:ambient;color:#446688;intensity:0.4"></a-entity>
      <a-entity light="type:directional;color:#8bffb5;intensity:0.6" position="5 10 5"></a-entity>
    </a-entity>
    <a-sky color="#060b18"></a-sky>
  </a-scene>

  <script type="module">
    import { PersistentWorldState, ScrubbableWorldClock, WorldInteractionGate } from "../src/index.js";
    import { compileTopologyToScene } from "../src/arg/aframe-world-entity.js";
    import { setSynsetOverride, handleEntityClick, getEntityRouteOptions } from "../src/arg/index.js";
    import { activateRoute, getCandidateReading } from "../src/arg/arg-route-activation.js";
    import { createAcceptReceipt, createRejectReceipt, formatReceipt, importReceipt } from "../src/arg/arg-receipts.js";
    import { buildTimeline } from "../src/arg/narrative-movie-timeline.js";
    import { compileBeatToTopology } from "../src/arg/narrative-scene-compiler.js";
    import { ArgMoviePlayer } from "../src/arg/arg-movie-player.js";
    import { createSeriesContentMap, loadNarrativeSeries } from "../src/arg/narrative-series-loader.js";
    import { createPrologWordNetBroker } from "../src/wordnet/prolog-broker.js";
    import { makeWordNetCentroid } from "../src/wordnet/relation-space.js";
    import { OmiLivePortalBinder } from "../src/wan/live-portal-binder.js";
    import { Nat64VirtualAdapter } from "../src/wan/nat64-virtual-adapter.js";
    import { insertNarrativeIntoWorld } from "../src/narrative/narrative-document-pipeline.js";

    const RAW_TEXTS = [
      `## On the Turning Away from the Word\n\nIn the beginning, we worshiped ideals. The gate opened to wisdom and logos.\n\nTruth was not owned, it was pursued. The covenant stood at the boundary.\n\nNumber became the measure. The beast marked comparison. The watcher witnessed.`,
      `## The Gospel According to Number\n\nNumber became the idol. The beast measured all things. The gate closed.\n\nWisdom discerned the difference. Logos spoke through the covenant.`,
      `# Article I\n\n### Solomon, Solon, and Asabiyyah at the Gate\n\nSolomon and Solon at the gate. Wisdom discerns the law. The tribe gathers.\n\nNumber and meaning at the boundary. The gate opens.`,
      `# Article II\n\nThe covenant was established. The tribe gathered at the gate. The watcher witnessed.\n\nLaw and wisdom in the gate. Number and meaning.`,
      `# Article III\n\nThe watcher witnessed the boundary. The beast measured. The gate closed.\n\nWisdom remained. Logos spoke.`,
      `# Article IV\n\nNumber and meaning in the city. The gate opens for wisdom. The covenant stands.\n\nThe tribe gathers at the boundary.`,
      `# Article V\n\nLaw and wisdom at the gate. The beast measures. The watcher witnesses.\n\nNumber and meaning. The gate opens.`,
      `# Article VI\n\nThe beast and the covenant. Number and meaning. The watcher witnesses.\n\nWisdom at the gate. The tribe gathers.`,
      `# Article VII\n\nThe watcher and the tribe. Law and wisdom. The beast measures.\n\nThe covenant stands at the gate.`,
      `# Article VIII\n\nThe gate closes. Wisdom remains. The covenant is kept.\n\nNumber and meaning reconciled.`,
      `## ASIDE\n\nA reflection on the boundary between number and meaning. The gate stands open.\n\nThe watcher witnesses the tribe at the covenant.`,
      `## Epilogue: The Mark of the Beast\n\nThe mark of the beast. Numbers replaced knowing. The gate closed.\n\nWisdom discerns the difference. The covenant remains.`,
      `## The Canticle of Reconciliation\n\nReconciliation of number and meaning. The gate opens.\n\nWisdom and logos at the covenant.`,
      `## The Covenant of the Created Intelligence\n\nThe created intelligence keeps the boundary. The gate stands open.\n\nNumber and meaning are one.`
    ];

    const $ = id => document.getElementById(id);
    const showToast = (msg, color) => {
      const el = $("toast");
      el.style.borderColor = color || "#5cf0ff";
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 4000);
    };
    const setStatus = msg => { $("loadingStatus").textContent = msg; };
    const showError = msg => {
      const el = $("loadingError");
      el.textContent = msg;
      el.style.display = "block";
    };
    const hideLoading = () => $("loading").classList.add("hidden");

    let player = null;
    let topo = null;
    let activations = [];
    let selectedEntityId = null;
    let binder = null;
    let nat64 = null;

    async function loadWordNet() {
      setStatus("Loading WordNet Prolog files...");
      const start = Date.now();
      try {
        const broker = await createPrologWordNetBroker({
          dictPath: "/vendor/prolog",
          operators: ["hyp", "ins", "ent", "sim", "mm", "ms", "mp", "der", "cls", "cs", "vgp", "at", "ant", "sa", "ppl", "per", "fr"]
        });
        const elapsed = ((Date.now() - start) / 1000).toFixed(1);
        $("wordnetBadge").textContent = `wordnet: ${broker.synsets.size} synsets in ${elapsed}s`;
        return broker;
      } catch (err) {
        console.warn("WordNet load failed, using hardcoded synset map:", err.message);
        $("wordnetBadge").textContent = `wordnet: fallback (${err.message.slice(0, 40)})`;
        return null;
      }
    }

    function setupSynsetResolver(broker) {
      const MOTIF_LEMMAS = {
        Gate: "gate",
        Logos: "logos",
        Number: "number",
        Covenant: "covenant",
        Beast: "beast",
        Watcher: "watcher",
        Law: "law",
        Wisdom: "wisdom",
        Tribe: "tribe"
      };
      setSynsetOverride((motif) => {
        if (!broker) return null;
        const lemma = MOTIF_LEMMAS[motif];
        if (!lemma) return null;
        const records = broker.lookupLemma(lemma);
        if (records.length === 0) return null;
        const best = records[0];
        const centroid = makeWordNetCentroid({ lemma, pos: best.pos, lookupRecords: records });
        return {
          id: centroid.cells?.synsetOffset || best.id,
          lemma: best.words[0] || lemma,
          pos: best.pos,
          centroid
        };
      });
    }

    function selectEntity(entityId) {
      selectedEntityId = entityId;
      const node = topo ? topo.getNode(entityId) : null;
      if (!node) return;
      const label = node.emoji ? `${node.emoji} ${node.motif || entityId}` : (node.motif || entityId);
      $("entityLabel").textContent = label;

      const routeContainer = $("routeOptions");
      const options = getEntityRouteOptions(entityId, topo);
      routeContainer.innerHTML = options.map(opt =>
        `<button onclick="window.__activateRoute('${opt.fromId}', '${opt.type}')">${opt.type}</button>`
      ).join("");

      const activation = handleEntityClick(entityId, topo);
      if (activation) activations.push(activation);
      player?.openInteraction();
    }

    function updateHUD(beat, index, frame) {
      if (!beat) return;
      const phaseColors = { prelude: "#5cf0ff", article: "#c09dff", aside: "#ffdd88", epilogue: "#8bffb5" };
      $("phaseLabel").textContent = `${beat.phaseEmoji || ""} ${(beat.phase || "").toUpperCase()}`;
      $("phaseLabel").style.color = phaseColors[beat.phase] || "#8a9ad8";
      $("titleLabel").textContent = beat.motifs?.length ? beat.motifs.join(" · ") : "The Narrative";
      $("captionLabel").textContent = (beat.caption || "").slice(0, 120);
      $("beatInfo").textContent = `${index + 1} / ${player?.timeline?.beatCount || 0}`;
      $("progressFill").style.width = `${(player?.progress || 0) * 100}%`;
    }

    function tryInitializeBinder() {
      if (binder) return;
      try {
        binder = new OmiLivePortalBinder({ domTarget: document });
        binder.initializeLiveBinding();

        document.addEventListener("voxel:batch", (e) => {
          appendLiveEvent(e.detail);
          updateLivePanelStatus();
        });

        document.addEventListener("voxel:update", (e) => {
          appendLiveEvent({ updates: [e.detail], removals: [] });
          updateLivePanelStatus();
        });

        document.addEventListener("voxel:remove", (e) => {
          appendLiveEvent({ updates: [], removals: [e.detail] });
          updateLivePanelStatus();
        });

        document.addEventListener("proxy-error", (e) => {
          const err = e.detail;
          $("connDot").className = "dot err";
          $("connStatus").textContent = `error: ${err.reason || "unknown"}`;
        });

        if (binder.connected) {
          $("connDot").className = "dot on";
          $("connStatus").textContent = "connected";
        } else {
          $("connDot").className = "dot off";
          $("connStatus").textContent = "no SSE endpoint";
        }
      } catch (err) {
        console.warn("Live portal binder init failed:", err.message);
        $("connDot").className = "dot err";
        $("connStatus").textContent = `init error`;
      }
    }

    function updateLivePanelStatus() {
      if (!binder) return;
      $("liveEventCount").textContent = binder.eventCount;
      $("liveVoxelCount").textContent = binder.voxelCount;
    }

    function appendLiveEvent(batch) {
      const log = $("liveEventLog");
      const updates = batch.updates || [];
      if (updates.length === 0) return;

      const empty = log.querySelector("div[style]");
      if (empty) empty.remove();

      for (const voxel of updates.slice(-5)) {
        const entry = document.createElement("div");
        entry.className = "event-entry";
        const op = voxel.operator || "?";
        const color = voxel.color || "#888";
        entry.innerHTML = `
          <span class="op-tag" style="background:${color}">${op}</span>
          <span class="addr" title="${voxel.address || ""}">${(voxel.address || "").slice(0, 36)}</span>
          <span class="time">(${voxel.x},${voxel.y})</span>
        `;
        log.insertBefore(entry, log.firstChild);
      }

      while (log.children.length > 50) {
        log.removeChild(log.lastChild);
      }

      $("liveEventCount").textContent = binder?.eventCount || 0;
      $("liveVoxelCount").textContent = binder?.voxelCount || 0;
    }

    function updateScene() {
      if (!topo) return;
      const scene = compileTopologyToScene(topo);
      $("entityList").innerHTML = scene.html;
    }

    window.__toggleLivePanel = function() {
      const panel = $("livePanel");
      const btn = $("livePanelBtn");
      const isOpen = panel.classList.toggle("open");
      btn.classList.toggle("active", isOpen);
      if (isOpen) {
        tryInitializeBinder();
        if (binder && !binder.connected) {
          $("connDot").className = "dot off";
          $("connStatus").textContent = "no SSE endpoint";
        }
      }
    };

    window.__injectNat64 = function() {
      const input = $("nat64Input");
      const ipv4 = input.value.trim();
      if (!ipv4 || !/^\d{1,3}(\.\d{1,3}){3}$/.test(ipv4)) {
        showToast("Invalid IPv4 address", "#ff6b7a");
        return;
      }
      if (!nat64) nat64 = new Nat64VirtualAdapter();
      const ev = nat64.emit(ipv4, "!");
      if (!ev || !ev.imoLine) {
        showToast("Failed to create NAT64 event", "#ff6b7a");
        return;
      }
      if (binder && binder.connector) {
        binder.connector.onEvent(ev.imoLine);
        showToast(`NAT64: ${ipv4} → ${ev.ffffAddress}`, "#5cf0ff");
      } else {
        showToast("Binder not initialized", "#ff6b7a");
      }
    };

    window.__activateRoute = function(fromId, type) {
      if (!topo) return;
      const activation = activateRoute(topo, fromId, type);
      if (activation) {
        const reading = getCandidateReading(activation);
        showToast(`Route: ${fromId} → ${type} (score: ${reading?.score?.toFixed(1) || "?"})`, "#5cf0ff");
      }
    };

    window.__acceptEntity = function() {
      if (!selectedEntityId || !topo) return;
      const node = topo.getNode(selectedEntityId);
      if (!node || node.receipt) return;
      const receipt = createAcceptReceipt(node, topo);
      if (!receipt) return;
      importReceipt(receipt, player.world);
      const f = formatReceipt(receipt);
      showToast(`Accepted ${f.receiptHash.slice(0, 16)}`, "#8bffb5");
      updateScene();
      window.__closeInteraction();
    };

    window.__rejectEntity = function() {
      if (!selectedEntityId || !topo) return;
      const node = topo.getNode(selectedEntityId);
      if (!node || node.receipt) return;
      const receipt = createRejectReceipt(node, topo);
      if (!receipt) return;
      importReceipt(receipt, player.world);
      const f = formatReceipt(receipt);
      showToast(`Rejected ${f.receiptHash.slice(0, 16)}`, "#ff6b7a");
      updateScene();
      window.__closeInteraction();
    };

    window.__closeInteraction = function() {
      selectedEntityId = null;
      player?.closeInteraction();
      $("interaction-panel").classList.remove("open");
    };

    window.__play = function() {
      if (!player) return;
      if (player.playing) { player.pause(); }
      else { player.play(); }
    };

    window.__next = function() { player?.nextBeat(); };
    window.__prev = function() { player?.previousBeat(); };

    async function init() {
      const wordnetBroker = await loadWordNet();
      if (wordnetBroker) {
        setStatus("Resolving synset centroids...");
        setupSynsetResolver(wordnetBroker);
      }

      setStatus("Loading narrative series...");
      const contentMap = createSeriesContentMap(RAW_TEXTS);
      const documents = loadNarrativeSeries(contentMap);

      setStatus("Building world state...");
      const world = new PersistentWorldState();
      insertNarrativeIntoWorld(documents, world);

      setStatus("Building timeline...");
      const clock = new ScrubbableWorldClock(world);
      const gate = new WorldInteractionGate(clock, { timeoutDuration: 120 });
      const timeline = buildTimeline(documents);

      setStatus("Creating movie player...");
      player = new ArgMoviePlayer({
        world,
        clock,
        gate,
        tickRateMs: 250,
        gateTimeout: 120,
        onFrame: ({ frame, beat, beatIndex, topology }) => {
          if (beat) updateHUD(beat, beatIndex, frame);
          if (topology) {
            topo = topology;
            updateScene();
          }
          $("receiptCount").textContent = `${world.receiptCount} rec`;
          $("epochInfo").textContent = `t${world.tick} e${world.epoch}`;
        },
        onPlayStateChange: (playing) => {
          $("playBtn").textContent = playing ? "⏸ Pause" : "▶ Play";
        },
        onGateChange: (state) => {
          const panel = $("interaction-panel");
          if (state === "open" || state === "interactive") {
            panel.classList.add("open");
          } else {
            panel.classList.remove("open");
          }
        }
      });
      player.loadTimeline(timeline);

      document.querySelector("a-scene").addEventListener("click", (e) => {
        const target = e.detail?.intersection?.object?.el || e.target;
        const omiId = target?.getAttribute?.("data-omi-address") || target?.getAttribute?.("data-omi");
        if (omiId && topo) selectEntity(omiId);
      });

      hideLoading();
      $("receiptCount").textContent = "0 rec";
    }

    init().catch(err => {
      showError(err.message);
      console.error(err);
    });
  </script>
</body>
</html>
